
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageTurner Bookstore | Contact</title>
</head>
<body>

    <header>
        <h1>Contact Us</h1>
        <p>We would love to hear from you.</p>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a> |
            <a href="books.html">Books</a> |
            <a href="about.html">About Us</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <hr>

    <main>
        <section>
            <h2>Send Us a Message</h2>

            <form action="#" method="get">
                <p>
                    <label for="full-name">Full Name:</label><br>
                    <input
                        type="text"
                        id="full-name"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="name@example.com"
                        required
                    >
                </p>

                <p>
                    <label for="subject">Subject:</label><br>
                    <select id="subject" name="subject" required>
                        <option value="">-- Choose a subject --</option>
                        <option value="book-availability">Book availability</option>
                        <option value="order">Order question</option>
                        <option value="feedback">Feedback</option>
                        <option value="other">Other</option>
                    </select>
                </p>

                <fieldset>
                    <legend>Favorite Book Category</legend>

                    <input
                        type="radio"
                        id="fiction"
                        name="bookCategory"
                        value="fiction"
                    >
                    <label for="fiction">Fiction</label>

                    <input
                        type="radio"
                        id="technology"
                        name="bookCategory"
                        value="technology"
                    >
                    <label for="technology">Technology</label>

                    <input
                        type="radio"
                        id="business"
                        name="bookCategory"
                        value="business"
                    >
                    <label for="business">Business</label>
                </fieldset>

                <p>
                    <label for="message">Message:</label><br>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                        placeholder="Write your message here..."
                        required
                    ></textarea>
                </p>

                <p>
                    <input
                        type="checkbox"
                        id="updates"
                        name="updates"
                        value="yes"
                    >
                    <label for="updates">
                        I would like to receive book updates.
                    </label>
                </p>

                <button type="submit">Send Message</button>
                <button type="reset">Reset Form</button>
            </form>
        </section>

        <hr>

        <section>
            <h2>Other Ways to Reach Us</h2>

            <p>
                Email:
                <a href="mailto:hello@pageturner.example">
                    hello@pageturner.example
                </a>
            </p>

            <p>
                Phone:
                <a href="tel:+959123456789">
                    +95 9 123 456 789
                </a>
            </p>

            <p><a href="index.html">Return to Home Page</a></p>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 PageTurner Bookstore. All rights reserved.</p>
    </footer>

</body>
</html>
